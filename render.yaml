services:
  - type: web
    name: sistema-edenhub
    env: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT wsgi:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URI
        value: sqlite:////opt/render/project/src/instance/edenred.db
      - key: FLASK_APP
        value: main.py
      - key: FLASK_ENV
        value: production
