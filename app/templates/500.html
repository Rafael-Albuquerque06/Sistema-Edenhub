{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">

        <div class="card card-edenred">
            <div class="card-body py-5">
                <i class="bi bi-exclamation-octagon fs-1 text-edenred mb-3"></i>

        </div>
    </div>
