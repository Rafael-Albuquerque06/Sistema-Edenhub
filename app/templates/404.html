{% extends 'base.html' %}

{% block title %}Página não encontrada - Edenhub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card card-edenred">
            <div class="card-body py-5">
                <i class="bi bi-exclamation-triangle fs-1 text-edenred mb-3"></i>
                <h1 class="display-4 fw-bold text-dark">404</h1>
                <h2 class="text-dark mb-3">Página não encontrada</h2>
                <p class="text-muted mb-4">
                    A página que você está procurando não existe ou foi movida.
                </p>
                <a href="{{ url_for('main.home') }}" class="btn btn-edenred">
                    <i class="bi bi-house-door me-2"></i> Voltar ao Início
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
